name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # restore caches
      - name: restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache@v3
        with:
          path: c:/vcpkg/installed/x64-windows
          key: ${{ runner.os }}-vcpkg-installed

      - name: restore tensorflow c api cache
        id: cache-tf
        uses: actions/cache@v3
        with:
          path: c:/tensorflow
          key: ${{ runner.os }}-tf-capi-2.18.1

      - name: restore libtorch c api cache
        id: cache-libtorch
        uses: actions/cache@v3
        with:
          path: c:/pytorch
          key: ${{ runner.os }}-torch-capi-2.7.0

      # install deps only on cache miss
      - name: install c++ deps
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          echo "installing opencv"
          & c:/vcpkg/vcpkg.exe install opencv4:x64-windows

      - name: download tensorflow c api
        if: steps.cache-tf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/tensorflow/versions/2.18.1/libtensorflow-cpu-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile tf.zip
          Expand-Archive tf.zip -DestinationPath c:/tensorflow
          rm tf.zip

      - name: download libtorch c api
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.7.0%2Bcpu.zip"
          Invoke-WebRequest $url -OutFile torch.zip
          Expand-Archive torch.zip -DestinationPath c:/pytorch
          rm torch.zip

      # configure & build
      - name: configure & build
        shell: pwsh
        run: |
          mkdir build
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=c:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DUI_RELEASE:BOOL=true `
            -DTorch_DIR=c:/pytorch/libtorch/share/cmake/Torch `
            -DOpenCV_DIR=c:/vcpkg/installed/x64-windows/share/opencv4 `
            -Dtensorflow_INCLUDE_DIRS=c:/tensorflow/include `
            -Dtensorflow_LIBRARIES=c:/tensorflow/lib/tensorflow.lib
          cmake --build build

      # save caches regardless of build success
      - name: save vcpkg cache
        if: always()
        uses: actions/cache@v3
        with:
          path: c:/vcpkg/installed/x64-windows
          key: ${{ runner.os }}-vcpkg-installed

      - name: save tensorflow c api cache
        if: always()
        uses: actions/cache@v3
        with:
          path: c:/tensorflow
          key: ${{ runner.os }}-tf-capi-2.18.1

      - name: save libtorch c api cache
        if: always()
        uses: actions/cache@v3
        with:
          path: c:/pytorch
          key: ${{ runner.os }}-torch-capi-2.7.0

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: set lowercase repository name
        id: repo_name
        run: echo "REPO_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull and run container
        run: |
          echo "using container image: ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest"
          docker pull ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest
          docker run --rm -v $PWD:/app -w /app ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest bash -c "
            mkdir build && cd build && cmake .. -DUI_RELEASE:bool=true -DTorch_DIR=/opt/libtorch/share/cmake/Torch && make -j$(nproc)
          "

  release-windows:
    needs: build-windows
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # restore caches
      - name: restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache@v3
        with:
          path: c:/vcpkg/installed/x64-windows
          key: ${{ runner.os }}-vcpkg-installed

      - name: restore tensorflow c api cache
        id: cache-tf
        uses: actions/cache@v3
        with:
          path: c:/tensorflow
          key: ${{ runner.os }}-tf-capi-2.18.1

      - name: restore libtorch c api cache
        id: cache-libtorch
        uses: actions/cache@v3
        with:
          path: c:/pytorch
          key: ${{ runner.os }}-torch-capi-2.7.0

      # install deps on cache miss
      - name: install c++ deps
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & c:/vcpkg/vcpkg.exe install opencv4:x64-windows

      - name: download tensorflow c api
        if: steps.cache-tf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/tensorflow/versions/2.18.1/libtensorflow-cpu-windows-x86_64.zip"
          Invoke-WebRequest $url -OutFile tf.zip
          Expand-Archive tf.zip -DestinationPath c:/tensorflow
          Remove-Item tf.zip

      - name: download libtorch c api
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.7.0%2Bcpu.zip"
          Invoke-WebRequest $url -OutFile torch.zip
          Expand-Archive torch.zip -DestinationPath c:/pytorch
          Remove-Item torch.zip

      # configure & build in Release mode
      - name: configure & build (release)
        shell: pwsh
        run: |
          mkdir build
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=c:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DUI_RELEASE:BOOL=true `
            -DTorch_DIR=c:/pytorch/libtorch/share/cmake/Torch `
            -DOpenCV_DIR=c:/vcpkg/installed/x64-windows/share/opencv4 `
            -Dtensorflow_INCLUDE_DIRS=c:/tensorflow/include `
            -Dtensorflow_LIBRARIES=c:/tensorflow/lib/tensorflow.lib
          cmake --build build
          ls build

      # package
      - name: zip windows artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build\x64\* -DestinationPath ${{ github.ref_name }}-windows.zip

      # publish
      - name: create github release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: upload windows asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.ref_name }}-windows.zip
          asset_name: ${{ github.ref_name }}-windows.zip
          asset_content_type: application/zip

