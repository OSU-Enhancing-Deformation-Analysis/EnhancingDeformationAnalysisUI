name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'CMakeLists.txt'
      - 'core/**'
      - 'apps/**'
      - 'libs/**'
      - 'assets/**'
      - 'Dockerfile'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: setup dependencies
        uses: ./.github/actions/setup-windows-deps

      - name: configure & build
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=c:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DUI_RELEASE:BOOL=true `
            -DTorch_DIR=c:/pytorch/libtorch/share/cmake/Torch `
            -DOpenCV_DIR=c:/vcpkg/installed/x64-windows/share/opencv4 `
            -Dtensorflow_INCLUDE_DIRS=c:/tensorflow/include `
            -Dtensorflow_LIBRARIES=c:/tensorflow/lib/tensorflow.lib
          cmake --build build

      - name: package windows artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path build\Debug\EnhancingDeformationAnalysisUI.exe -DestinationPath windows-release.zip
          Compress-Archive -Update assets/ windows-release.zip

      - name: upload windows artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: set lowercase repository name
        id: repo_name
        run: echo "REPO_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull and run container
        run: |
          echo "using container image: ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest"
          docker pull ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest
          docker run --rm -v $PWD:/app -w /app ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest bash -c "
            mkdir build && cd build && cmake .. \
              -DUI_RELEASE:bool=true \
              -DTorch_DIR=/opt/libtorch/share/cmake/Torch \
              -DEDA_WITH_TENSORFLOW=ON \
              -Dtensorflow_INCLUDE_DIRS=/usr/local/include \
              -Dtensorflow_LIBRARIES=/usr/local/lib/libtensorflow.so \
            && make -j\$(nproc)
          "

  release-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: rename artifact
        run: mv windows-release.zip ${{ github.ref_name }}-windows.zip

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          prerelease: true
          files: ${{ github.ref_name }}-windows.zip
