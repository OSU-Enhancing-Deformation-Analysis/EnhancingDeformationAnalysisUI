name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: cache vcpkg installed
        id: cache-vcpkg
        uses: actions/cache@v3
        with:
          path: c:/vcpkg/installed/x64-windows
          key: ${{ runner.os }}-vcpkg-installed
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed

      - name: bootstrap & install c++ deps
        shell: pwsh
        continue-on-error: true
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          echo "installing opencv"
          & c:/vcpkg/vcpkg.exe install opencv4:x64-windows
      
      - name: immediate cache
        if: always()
        with:
          path: c:/vcpkg/installed/x64-windows
          key: ${{ runner.os }}-vcpkg-installed
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed

      # cache tensorflow c api
      - name: cache tensorflow c api
        uses: actions/cache@v3
        with:
          path: c:/tensorflow
          key: ${{ runner.os }}-tf-capi-2.18.1
      
      - name: download tensorflow c api
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/tensorflow/versions/2.18.1/libtensorflow-cpu-windows-x86_64.zip"
          if (-not (test-path c:/tensorflow/include)) {
            Invoke-WebRequest $url -OutFile tf.zip
            Expand-Archive tf.zip -DestinationPath c:/tensorflow
            rm tf.zip
          }

      # cache pytorch c api
      - name: cache libtorch c api
        uses: actions/cache@v3
        with:
          path: c:/pytorch
          key: ${{ runner.os }}-torch-capi-2.7.0

      - name: download libtorch c api
        shell: pwsh
        run: |
          $url = "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.7.0%2Bcpu.zip"
          if (-not (test-path c:/pytorch/lib)) {
            Invoke-WebRequest $url -OutFile torch.zip
            Expand-Archive torch.zip -DestinationPath c:/pytorch
            rm torch.zip
          }
          # debug
          ls c:/pytorch
          ls c:/tensorflow
      
      - name: configure & build
        shell: pwsh
        run: |
          mkdir build
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE=c:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DUI_RELEASE:BOOL=true `
            -DTorch_DIR=c:/pytorch/libtorch/share/cmake/Torch `
            -DOpenCV_DIR=c:/vcpkg/installed/x64-windows/share/opencv4 `
            -DTENSORFLOW_INCLUDE_DIRS=c:/tensorflow/include `
            -DTENSORFLOW_LIBRARIES=c:/tensorflow/lib/tensorflow.lib
          cmake --build build

  build-linux:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: set lowercase repository name
        id: repo_name
        run: echo "REPO_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull and run container
        run: |
          echo "using container image: ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest"
          docker pull ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest
          docker run --rm -v $PWD:/app -w /app ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest bash -c "
            mkdir build && cd build && cmake .. -DUI_RELEASE:bool=true -DTorch_DIR=/opt/libtorch/share/cmake/Torch && make -j$(nproc)
          "

  release:
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - name: set lowercase repository name
        id: repo_name
        run: echo "REPO_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: pull ci images
        run: |
          docker pull ghcr.io/${REPO_NAME_LOWER}/ci-image-windows:latest
          docker pull ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest

      - name: build windows release
        shell: powershell
        run: |
          docker run --rm -v ${PWD}:C:\app ghcr.io/${REPO_NAME_LOWER}/ci-image-windows:latest powershell -Command "mkdir build; cd build; cmake -G 'Visual Studio 17 2022' ..; cmake --build . --config Release"
          powershell -Command "Compress-Archive -Path build\\Release\\* -DestinationPath deformationanalysisUI-${{ github.ref_name }}-windows.zip"

      - name: build linux release
        run: |
          docker run --rm -v $PWD:/app -w /app ghcr.io/${REPO_NAME_LOWER}/ci-image-linux:latest bash -lc "mkdir build && cd build && cmake .. && make -j$(nproc)"
          tar czf deformationanalysisUI-${{ github.ref_name }}-linux.tar.gz -C build deformationanalysisUI_executable*

      - name: create github release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: upload windows asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: deformationanalysisUI-${{ github.ref_name }}-windows.zip
          asset_name: deformationanalysisUI-${{ github.ref_name }}-windows.zip
          asset_content_type: application/zip

      - name: upload linux asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: deformationanalysisUI-${{ github.ref_name }}-linux.tar.gz
          asset_name: deformationanalysisUI-${{ github.ref_name }}-linux.tar.gz
          asset_content_type: application/gzip

